name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  API_IMAGE: fraud-api
  ML_PIPELINE_IMAGE: fraud-ml-pipeline
  AIRFLOW_IMAGE: fraud-airflow
  FRONTEND_IMAGE: fraud-frontend
  EVIDENTLY_IMAGE: fraud-evidently

jobs:
  # ── Job 1: Lint & Test ──────────────────────────────────────────────
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fraud_detection
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin123
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # ── Setup: chờ MinIO + tạo buckets ─────────────────────────────
      - name: Setup MinIO buckets
        run: |
          sleep 10
          docker run --rm \
            --network host \
            --entrypoint /bin/sh \
            minio/mc:latest \
            -c 'mc alias set local http://localhost:9000 minioadmin minioadmin123 && \
                mc mb local/mlflow-artifacts --ignore-existing && \
                mc mb local/drift-reports --ignore-existing && \
                mc anonymous set download local/mlflow-artifacts && \
                mc anonymous set download local/drift-reports && \
                echo "MinIO buckets ready"'

      # ── Python / ML Serving ────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install ML Serving deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --break-system-packages \
            -r services/ml-serving/requirements.txt

      - name: Lint Python (ML Serving)
        run: |
          python3 -m pip install --break-system-packages flake8
          python3 -m flake8 services/ml-serving/ --max-line-length=120 --ignore=F401,F841

      - name: Test ML Serving
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fraud_detection
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin123
          MINIO_BUCKET_REPORTS: drift-reports
        run: |
          python3 -m pip install --break-system-packages pytest httpx boto3 pydantic
          DATABASE_URL="$DATABASE_URL" \
          python3 -m pytest services/ml-serving/ -v || true

      # ── Python / ML Pipeline ───────────────────────────────────────
      - name: Install ML Pipeline deps
        run: |
          python3 -m pip install --break-system-packages \
            -r services/ml-pipeline/requirements.txt

      - name: Lint Python (ML Pipeline)
        run: |
          python3 -m flake8 \
            services/ml-pipeline/scripts/detect_drift.py \
            services/ml-pipeline/scripts/train.py \
            services/ml-pipeline/scripts/export_transactions.py \
            --max-line-length=120 --ignore=F401,F841,F541,E127,E128,E303

      - name: Test ML Pipeline imports
        env:
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin123
          MINIO_BUCKET_REPORTS: drift-reports
        run: |
          python3 -c "
            import sys
            sys.path.insert(0, 'services/ml-pipeline')
            from scripts.detect_drift import _upload_to_minio, FEATURE_COLS, _upload_to_minio
            print('detect_drift imports OK, FEATURE_COLS:', len(FEATURE_COLS))
          "

      # ── Python / Evidently Service ──────────────────────────────────
      - name: Lint Python (Evidently Service)
        run: |
          python3 -m pip install --break-system-packages flake8
          python3 -m flake8 services/evidently/ --max-line-length=120 || true

      # ── Frontend ───────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install & build frontend
        working-directory: ./services/frontend
        run: |
          npm ci
          npm run build

  # ── Job 2: Docker Build & Push ────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API Server image
        uses: docker/build-push-action@v5
        with:
          context: ./services/ml-serving
          file: ./services/ml-serving/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.API_IMAGE }}:latest

      - name: Build ML Pipeline image
        uses: docker/build-push-action@v5
        with:
          context: ./services/ml-pipeline
          file: ./services/ml-pipeline/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.ML_PIPELINE_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.ML_PIPELINE_IMAGE }}:latest

      - name: Build Evidently Service image
        uses: docker/build-push-action@v5
        with:
          context: ./services/evidently
          file: ./services/evidently/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.EVIDENTLY_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.EVIDENTLY_IMAGE }}:latest

      - name: Build Airflow image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.airflow
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.AIRFLOW_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.AIRFLOW_IMAGE }}:latest

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./services/frontend
          file: ./services/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.FRONTEND_IMAGE }}:latest