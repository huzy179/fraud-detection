name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  API_IMAGE: fraud-api
  FRONTEND_IMAGE: fraud-frontend

jobs:
  # ── Job 1: Lint & Test ──────────────────────────────────────────────
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fraud_detection
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # ── Python / ML Serving ────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --break-system-packages -r services/ml-serving/requirements.txt

      - name: Lint Python
        run: |
          python3 -m pip install --break-system-packages flake8
          python3 -m flake8 services/ml-serving/ --max-line-length=120

      - name: Test ML Serving
        run: |
          python3 -m pip install --break-system-packages pytest httpx
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/fraud_detection" \
          python3 -m pytest services/ml-serving/ -v

      # ── Frontend ───────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install & build frontend
        working-directory: ./services/frontend
        run: |
          npm ci
          npm run build

  # ── Job 2: Docker Build & Push ────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build args
      - name: Build API Server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/ml-serving/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.API_IMAGE }}:latest

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.FRONTEND_IMAGE }}:latest
